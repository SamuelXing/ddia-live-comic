    <!--
      Social preview. Without these, pasting a link into Slack, X, LinkedIn or

      gets read at all.

      og:image MUST be absolute: every scraper rejects a relative path, and it
      fails silently, so the card just quietly appears without a picture. The
      origin below is duplicated in src/site.ts (SITE_URL) because a static
      index.html cannot import from the app — change both together when the
      first deploy assigns a hostname or a custom domain is attached.
    -->
